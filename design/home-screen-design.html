<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Home – cycling themes</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jersey+10&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.bg-anim{background:linear-gradient(125deg,#0B0420,#24105A,#5B1A9E,#7A1FD0,#24105A,#0B0420)}
.px-bg{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;z-index:0;animation:hueSway 12s ease-in-out infinite alternate}
@keyframes hueSway{from{filter:hue-rotate(-15deg)}to{filter:hue-rotate(15deg)}}
.marquee{display:flex;gap:12px;width:max-content;animation:marquee 24s linear infinite}
@keyframes marquee{from{transform:translateX(0)}to{transform:translateX(calc(-50% - 6px))}}
@media (prefers-reduced-motion: reduce){.px-bg,.marquee{animation:none}}
</style>
</helmet>
<div class="bg-anim" style="position: relative; width: 390px; height: 844px; box-sizing: border-box; font-family: 'Jersey 10', system-ui, sans-serif; color: #C6FF3D; display: flex; flex-direction: column; overflow: hidden">
  <canvas class="px-bg" aria-hidden="true" ref="{{setCanvas}}"></canvas>
  <header style="position: relative; padding: 56px 20px 16px; display: flex; align-items: center; gap: 12px; height: 690px">
    <div style="display: flex; flex-direction: column; gap: 24px">
      <h1 ref="{{setTitle}}" style="position: relative; margin: 0; font-size: 116px; font-weight: 400; width: 341px; height: 291px; color: #C6FF3D; line-height: 0.75">PONETE<br>ALGO,<br>GORDO!</h1>
      <div style="position: relative; width: 341px; height: 76px">
        <div aria-hidden="true" style="position: absolute; inset: -5px; border-radius: 43px; background: #FFFFFF; mix-blend-mode: difference; pointer-events: none"></div>
        <button ref="{{setPrimary}}" type="button" onClick="{{onRandom}}" style="position: relative; width: 341px; height: 76px; border: 0; border-radius: 38px; color: #0B0420; background-color: #C6FF3D; display: flex; align-items: center; justify-content: center; gap: 14px; font-family: 'Jersey 10', system-ui, sans-serif; font-size: 46px; font-weight: 400; letter-spacing: 0.04em; cursor: pointer"><svg aria-hidden="true" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5"></path><path d="M4 20 21 3"></path><path d="M21 16v5h-5"></path><path d="m15 15 6 6"></path><path d="M4 4l5 5"></path></svg>Random</button>
      </div>
      <button ref="{{setSecondary}}" type="button" style="width: 341px; height: 64px; margin-top: -8px; border: 3px solid #C6FF3D; border-radius: 32px; color: #C6FF3D; background-color: #0B0420; display: flex; align-items: center; justify-content: center; gap: 12px; font-family: 'Jersey 10', system-ui, sans-serif; font-size: 36px; font-weight: 400; letter-spacing: 0.04em; cursor: pointer"><svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="13" height="13" rx="2"></rect><path d="M7 4h11a2 2 0 0 1 2 2v11"></path></svg><span>Colecciones</span></button>
    </div>
  </header>
  <section aria-label="Álbumes" style="position: relative; margin-top: auto; padding: 0 0 40px; display: flex; flex-direction: column; gap: 12px; height: 191px">
    <p ref="{{setLabel}}" style="margin: 0; padding: 0 24px; font-size: 30px; letter-spacing: 0.06em; color: #C6FF3D; line-height: 1">[N] ÁLBUMES</p>
    <div aria-hidden="true" style="overflow: hidden; width: 390px">
      <div class="marquee" style="padding-left: 24px">
        <div style="width: 72px; height: 72px; flex-shrink: 0; border-radius: 6px; background: #F4D35E"></div>
        <div style="width: 72px; height: 72px; flex-shrink: 0; border-radius: 6px; background: #0D3B66"></div>
        <div style="width: 72px; height: 72px; flex-shrink: 0; border-radius: 6px; background: #F95738"></div>
        <div style="width: 72px; height: 72px; flex-shrink: 0; border-radius: 6px; background: #7BDFF2"></div>
        <div style="width: 72px; height: 72px; flex-shrink: 0; border-radius: 6px; background: #EFF7F6"></div>
        <div style="width: 72px; height: 72px; flex-shrink: 0; border-radius: 6px; background: #1B1B1B"></div>
        <div style="width: 72px; height: 72px; flex-shrink: 0; border-radius: 6px; background: #EE964B"></div>
        <div style="width: 72px; height: 72px; flex-shrink: 0; border-radius: 6px; background: #F7D6E0"></div>
        <div style="width: 72px; height: 72px; flex-shrink: 0; border-radius: 6px; background: #F4D35E"></div>
        <div style="width: 72px; height: 72px; flex-shrink: 0; border-radius: 6px; background: #0D3B66"></div>
        <div style="width: 72px; height: 72px; flex-shrink: 0; border-radius: 6px; background: #F95738"></div>
        <div style="width: 72px; height: 72px; flex-shrink: 0; border-radius: 6px; background: #7BDFF2"></div>
        <div style="width: 72px; height: 72px; flex-shrink: 0; border-radius: 6px; background: #EFF7F6"></div>
        <div style="width: 72px; height: 72px; flex-shrink: 0; border-radius: 6px; background: #1B1B1B"></div>
        <div style="width: 72px; height: 72px; flex-shrink: 0; border-radius: 6px; background: #EE964B"></div>
        <div style="width: 72px; height: 72px; flex-shrink: 0; border-radius: 6px; background: #F7D6E0"></div>
      </div>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"hold":{"editor":"range","default":5,"min":1,"max":20,"step":1,"unit":"s","section":"Themes"},"fade":{"editor":"range","default":2.5,"min":0.5,"max":8,"step":0.5,"unit":"s","section":"Themes"},"pixelSize":{"editor":"range","default":15,"min":6,"max":40,"step":1,"unit":"px","section":"Background"},"speed":{"editor":"range","default":40,"min":20,"max":400,"step":10,"section":"Background"},"$preview":{"width":390,"height":844}}'>
const THEMES = [
  { pal: ['#0B0420', '#160A3A', '#24105A', '#3A1470', '#5B1A9E', '#7A1FD0', '#5B1A9E', '#3A1470', '#24105A', '#160A3A'], title: '#C6FF3D', pBg: '#C6FF3D', pFg: '#0B0420', sBg: '#0B0420', sFg: '#C6FF3D', sBd: '#C6FF3D' },
  { pal: ['#FF3D2E', '#FF5A24', '#FF7A1A', '#FF9A14', '#FFB81A', '#FFD84D', '#FFB81A', '#FF9A14', '#FF7A1A', '#FF5A24'], title: '#2A0A4A', pBg: '#2A0A4A', pFg: '#FFE9A8', sBg: '#FFF4D6', sFg: '#2A0A4A', sBd: '#2A0A4A' },
  { pal: ['#00C2FF', '#00D4E0', '#00E0B8', '#3DF5A0', '#7CFF7A', '#A6FF5C', '#7CFF7A', '#3DF5A0', '#00E0B8', '#00D4E0'], title: '#000000', pBg: '#000000', pFg: '#A6FF5C', sBg: '#FFFFFF', sFg: '#000000', sBd: '#000000' },
  { pal: ['#03102E', '#061C4A', '#0A2A6E', '#0F3D99', '#1752CC', '#1E6BFF', '#1752CC', '#0F3D99', '#0A2A6E', '#061C4A'], title: '#FFFFFF', pBg: '#FFFFFF', pFg: '#0F3D99', sBg: '#03102E', sFg: '#FFFFFF', sBd: '#FFFFFF' }
];
const rgb = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const KEYS = ['title', 'pBg', 'pFg', 'sBg', 'sFg', 'sBd'];
const T = THEMES.map((t) => {
  const o = { pal: t.pal.map(rgb) };
  KEYS.forEach((k) => { o[k] = rgb(t[k]); });
  return o;
});
const mix = (a, b, k) => 'rgb(' + Math.round(a[0] + (b[0] - a[0]) * k) + ',' + Math.round(a[1] + (b[1] - a[1]) * k) + ',' + Math.round(a[2] + (b[2] - a[2]) * k) + ')';
class Component extends DCLogic {
  constructor(...args) {
    super(...args);
    this.raf = 0;
    this.waves = [];
    this.setCanvas = (el) => { this.canvas = el; if (el) this.start(); };
    this.setTitle = (el) => { this.titleEl = el; };
    this.setPrimary = (el) => { this.primaryEl = el; };
    this.setSecondary = (el) => { this.secondaryEl = el; };
    this.setLabel = (el) => { this.labelEl = el; };
    this.onRandom = (e) => {
      const c = this.canvas;
      if (!c) return;
      const cr = c.getBoundingClientRect();
      const br = e.currentTarget.getBoundingClientRect();
      this.waves.push({ fx: (br.left + br.width / 2 - cr.left) / cr.width, fy: (br.top + br.height / 2 - cr.top) / cr.height, t0: performance.now() });
      if (this.waves.length > 4) this.waves.shift();
    };
  }
  start() {
    if (this.raf) return;
    let still = false;
    try { still = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}
    const loop = (now) => { this.draw(now); if (!still) this.raf = requestAnimationFrame(loop); };
    this.raf = requestAnimationFrame(loop);
  }
  componentWillUnmount() { if (this.raf) cancelAnimationFrame(this.raf); this.raf = 0; }
  theme(now) {
    const hold = this.props.hold ?? 5;
    const fade = this.props.fade ?? 2.5;
    const period = hold + fade;
    const seg = (now / 1000) / period;
    const i = Math.floor(seg) % T.length;
    const j = (i + 1) % T.length;
    const local = (seg - Math.floor(seg)) * period;
    let k = local <= hold ? 0 : (local - hold) / fade;
    k = k * k * (3 - 2 * k);
    const a = T[i], b = T[j];
    const out = { pal: a.pal.map((c, n) => mix(c, b.pal[n], k)) };
    KEYS.forEach((key) => { out[key] = mix(a[key], b[key], k); });
    return out;
  }
  draw(now) {
    const c = this.canvas;
    if (!c) return;
    const th = this.theme(now);
    if (this.titleEl) this.titleEl.style.color = th.title;
    if (this.labelEl) this.labelEl.style.color = th.title;
    if (this.primaryEl) { this.primaryEl.style.backgroundColor = th.pBg; this.primaryEl.style.color = th.pFg; }
    if (this.secondaryEl) { this.secondaryEl.style.backgroundColor = th.sBg; this.secondaryEl.style.color = th.sFg; this.secondaryEl.style.borderColor = th.sBd; }
    const px = this.props.pixelSize ?? 15;
    const w = Math.ceil(390 / px), h = Math.ceil(844 / px);
    if (c.width !== w) c.width = w;
    if (c.height !== h) c.height = h;
    const ctx = c.getContext('2d');
    if (!ctx) return;
    const s = (now / 1000) * ((this.props.speed ?? 40) / 120);
    const cx = w * (0.5 + 0.45 * Math.sin(s * 0.7)), cy = h * (0.5 + 0.4 * Math.cos(s * 0.53));
    const PAL = th.pal, P = PAL.length, reach = Math.hypot(w, h);
    const active = this.waves.map((wv) => { const age = (now - wv.t0) / 1000; return { x: wv.fx * w, y: wv.fy * h, r: age * reach / 1.1, fade: 1 - age / 1.3 }; }).filter((wv) => wv.fade > 0);
    this.waves = this.waves.filter((wv) => (now - wv.t0) / 1000 < 1.3);
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const v = Math.sin(x * 0.18 + s * 1.3) + Math.sin(y * 0.11 - s * 0.9) + Math.sin(x * 0.12 + y * 0.08 + s * 1.1) + Math.sin(Math.hypot(x - cx, y - cy) * 0.28 - s * 1.7);
        let push = 0;
        for (let k = 0; k < active.length; k++) { const d = Math.hypot(x - active[k].x, y - active[k].y) - active[k].r; push += Math.exp(-(d * d) / 6) * active[k].fade * 5; }
        ctx.fillStyle = PAL[((Math.floor(((v + 4) / 8) * P * 2 + s * 0.8 + push) % P) + P) % P];
        ctx.fillRect(x, y, 1, 1);
      }
    }
  }
  renderVals() { return { setCanvas: this.setCanvas, setTitle: this.setTitle, setPrimary: this.setPrimary, setSecondary: this.setSecondary, setLabel: this.setLabel, onRandom: this.onRandom }; }
}
</script>
</body>
</html>
