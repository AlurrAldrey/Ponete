<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home screen – standalone preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jersey+10&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; background: #111; min-height: 100%; }
  body { display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 12px; min-height: 100vh; font-family: system-ui, sans-serif; }
  .hint { color: #aaa; font-size: 13px; margin: 0; }
  kbd { border: 1px solid #555; border-radius: 4px; padding: 0 4px; }
  .screen { position: relative; width: 390px; height: 844px; overflow: hidden; border-radius: 32px; font-family: 'Jersey 10', system-ui, sans-serif; display: flex; flex-direction: column; background: #0B0420; }
  .px-bg { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; animation: hueSway 12s ease-in-out infinite alternate; }
  @keyframes hueSway { from { filter: hue-rotate(-15deg); } to { filter: hue-rotate(15deg); } }

  header { position: relative; padding: 56px 20px 16px; display: flex; flex-direction: column; gap: 24px; flex-shrink: 0; }
  h1 { margin: 0; font-size: 116px; font-weight: 400; line-height: 0.75; width: 341px; height: 291px; white-space: pre-line; overflow-wrap: break-word; }
  .cursor { animation: blink .7s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .sr-only { position: absolute; width: 1px; height: 1px; margin: 0; overflow: hidden; clip: rect(0 0 0 0); }

  button { font-family: inherit; font-weight: 400; cursor: pointer; display: flex; align-items: center; justify-content: center; letter-spacing: 0.04em; }
  .ring-wrap { position: relative; width: 341px; height: 76px; }
  .ring { position: absolute; inset: -5px; border-radius: 43px; background: #fff; mix-blend-mode: difference; pointer-events: none; }
  .primary { position: relative; width: 341px; height: 76px; border: 0; border-radius: 38px; gap: 14px; font-size: 46px; }
  .secondary { width: 341px; height: 64px; border: 3px solid; border-radius: 32px; gap: 12px; font-size: 36px; }
  .btn-label { white-space: pre; }

  /* Album strip takes whatever height is left; covers are square and as tall as that space. */
  section { position: relative; flex: 1 1 auto; min-height: 0; padding: 24px 0 40px; display: flex; flex-direction: column; gap: 12px; top: 0; transition: top .5s ease, opacity .4s ease; }
  section.out { top: 160px; opacity: 0; pointer-events: none; }
  .label { margin: 0; padding: 0 24px; font-size: 30px; letter-spacing: 0.06em; line-height: 1; flex-shrink: 0; }
  .strip { overflow: hidden; width: 100%; flex: 1 1 auto; min-height: 0; }
  .marquee { display: flex; gap: 12px; width: max-content; height: 100%; padding-left: 24px; animation: marquee 24s linear infinite; }
  .marquee canvas { height: 100%; aspect-ratio: 1 / 1; flex-shrink: 0; border-radius: 10px; image-rendering: pixelated; }
  @keyframes marquee { from { transform: translateX(0); } to { transform: translateX(calc(-50% - 6px)); } }

  /* Selected state: buttons slide to the bottom (moved with `top`, not transform, so the difference-blend ring keeps
     blending with the background); album strip drops away; the picked cover pops in under the title. */
  .ctas { position: relative; top: 0; display: flex; flex-direction: column; gap: 16px; transition: top .7s cubic-bezier(.2,.8,.2,1); }
  .ctas.down { top: 277px; }
  .cover { position: absolute; left: 25px; top: 167px; width: 341px; height: 341px; border-radius: 16px; box-shadow: 0 10px 0 rgba(0,0,0,.25);
           image-rendering: pixelated; pointer-events: none; opacity: 0; transform: scale(.4); transition: opacity .25s ease, transform .25s ease; }
  .cover.show { opacity: 1; transform: scale(1); transition: opacity .4s ease, transform .55s cubic-bezier(.3,1.5,.5,1); }

  @media (prefers-reduced-motion: reduce) {
    .px-bg, .marquee, .cursor { animation: none; }
    .ctas, section, .cover, .cover.show { transition: none; }
  }
</style>
</head>
<body>
<div class="screen">
  <canvas class="px-bg" id="bg" aria-hidden="true"></canvas>

  <header>
    <h1 id="title"><span id="titleText">PONETE
ALGO,
GORDO!</span><span class="cursor" id="cursor" aria-hidden="true" hidden>▌</span></h1>
    <p class="sr-only" id="live" aria-live="polite"></p>
    <div class="ctas" id="ctas">
      <div class="ring-wrap">
        <div class="ring" aria-hidden="true"></div>
        <button class="primary" id="primary" type="button">
          <svg id="iconShuffle" aria-hidden="true" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5"/><path d="M4 20 21 3"/><path d="M21 16v5h-5"/><path d="m15 15 6 6"/><path d="M4 4l5 5"/></svg>
          <svg id="iconPlay" style="display:none" aria-hidden="true" width="30" height="30" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5z"/></svg>
          <span class="btn-label" id="primaryLabel">Random</span>
        </button>
      </div>
      <button class="secondary" id="secondary" type="button">
        <svg id="iconStack" aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="13" height="13" rx="2"/><path d="M7 4h11a2 2 0 0 1 2 2v11"/></svg>
        <svg id="iconShuffle2" style="display:none" aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5"/><path d="M4 20 21 3"/><path d="M21 16v5h-5"/><path d="m15 15 6 6"/><path d="M4 4l5 5"/></svg>
        <span class="btn-label" id="secondaryLabel">Colecciones</span>
      </button>
    </div>
  </header>

  <canvas class="cover" id="cover" width="16" height="16" aria-hidden="true"></canvas>

  <section aria-label="Álbumes" id="albums">
    <p class="label" id="label">[N] ÁLBUMES</p>
    <div class="strip" aria-hidden="true"><div class="marquee" id="marquee"></div></div>
  </section>
</div>
<p class="hint">Preview only: <kbd>Esc</kbd> = Android back gesture (returns home from an album).</p>
<script>
/* =====================================================================
   DATA (placeholders: replace with the real collection and artwork)
   Each placeholder album has 3 colors, used to draw abstract pixel "artwork"
   so the color extraction below has something real to read.
   ===================================================================== */
const ALBUMS = [
  { name: '[ÁLBUM 1]', art: ['#F4D35E', '#EE964B', '#2B2D42'] },
  { name: '[ÁLBUM 2]', art: ['#0D3B66', '#FAF0CA', '#F95738'] },
  { name: '[ÁLBUM 3]', art: ['#F95738', '#1B1B1B', '#FFD6BA'] },
  { name: '[ÁLBUM 4]', art: ['#7BDFF2', '#B2F7EF', '#3D348B'] },
  { name: '[ÁLBUM 5]', art: ['#EFF7F6', '#F7D6E0', '#7A6C5D'] },
  { name: '[ÁLBUM 6]', art: ['#1B1B1B', '#E63946', '#F1FAEE'] },
  { name: '[ÁLBUM 7]', art: ['#EE964B', '#5F0F40', '#FB8B24'] },
  { name: '[ÁLBUM 8]', art: ['#F7D6E0', '#9A348E', '#0D0628'] }
];
const HOME_TITLE = 'PONETE\nALGO,\nGORDO!';
const LABELS = { home: { primary: 'Random', secondary: 'Colecciones' }, selected: { primary: 'Escuchar', secondary: 'Otro' } };

/* ---------- Timing & geometry (844 frame) ---------- */
const HOLD = 5, FADE = 2.5, PIXEL = 15, SPEED = 40;
const ALBUM_BLEND = 0.9;        // seconds to blend the background into / out of the album's colors
const ERASE_MS = 28, TYPE_MS = 60;
const TITLE_W = 341, TITLE_H = 291, TITLE_MAX = 116, TITLE_MIN = 40;
const TITLE_TOP = 56, CTAS_TOP = 648, COVER_GAP = 24, FRAME_W = 390, COVER_MAX = 341;

/* ---------- Color helpers ---------- */
const rgb = (h) => [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
const css = (c) => 'rgb(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ')';
const lerp = (a, b, k) => [a[0]+(b[0]-a[0])*k, a[1]+(b[1]-a[1])*k, a[2]+(b[2]-a[2])*k];
const lum = (c) => { const f = (v) => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); }; return 0.2126*f(c[0]) + 0.7152*f(c[1]) + 0.0722*f(c[2]); };
const contrast = (a, b) => { const x = lum(a), y = lum(b); return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05); };
const sat = (c) => { const mx = Math.max(...c), mn = Math.min(...c); return mx === 0 ? 0 : (mx - mn) / mx; };
const KEYS = ['title','pBg','pFg','sBg','sFg','sBd'];
const mixTheme = (a, b, k) => { const o = { pal: a.pal.map((c, i) => lerp(c, b.pal[i], k)) }; KEYS.forEach((key) => { o[key] = lerp(a[key], b[key], k); }); return o; };

/* ---------- The 5 home themes (cycle) ---------- */
const THEMES = [
  { pal: ['#0B0420','#160A3A','#24105A','#3A1470','#5B1A9E','#7A1FD0','#5B1A9E','#3A1470','#24105A','#160A3A'], title: '#C6FF3D', pBg: '#C6FF3D', pFg: '#0B0420', sBg: '#0B0420', sFg: '#C6FF3D', sBd: '#C6FF3D' },
  { pal: ['#FF3D2E','#FF5A24','#FF7A1A','#FF9A14','#FFB81A','#FFD84D','#FFB81A','#FF9A14','#FF7A1A','#FF5A24'], title: '#2A0A4A', pBg: '#2A0A4A', pFg: '#FFE9A8', sBg: '#FFF4D6', sFg: '#2A0A4A', sBd: '#2A0A4A' },
  { pal: ['#00C2FF','#00D4E0','#00E0B8','#3DF5A0','#7CFF7A','#A6FF5C','#7CFF7A','#3DF5A0','#00E0B8','#00D4E0'], title: '#000000', pBg: '#000000', pFg: '#A6FF5C', sBg: '#FFFFFF', sFg: '#000000', sBd: '#000000' },
  { pal: ['#03102E','#061C4A','#0A2A6E','#0F3D99','#1752CC','#1E6BFF','#1752CC','#0F3D99','#0A2A6E','#061C4A'], title: '#FFFFFF', pBg: '#FFFFFF', pFg: '#0F3D99', sBg: '#03102E', sFg: '#FFFFFF', sBd: '#FFFFFF' },
  { pal: ['#7B3CFF','#9D4BFF','#C24DFF','#E040FB','#FF3DCB','#FF5AA0','#FF3DCB','#E040FB','#C24DFF','#9D4BFF'], title: '#1E1E1E', pBg: '#FEFEFE', pFg: '#000000', sBg: '#1E1E1E', sFg: '#FEFEFE', sBd: '#000000' }
].map((t) => { const o = { pal: t.pal.map(rgb) }; KEYS.forEach((k) => { o[k] = rgb(t[k]); }); return o; });

function cycleTheme(now) {
  const period = HOLD + FADE;
  const seg = (now / 1000) / period;
  const i = Math.floor(seg) % THEMES.length, j = (i + 1) % THEMES.length;
  const local = (seg - Math.floor(seg)) * period;
  let k = local <= HOLD ? 0 : (local - HOLD) / FADE;
  k = k * k * (3 - 2 * k);
  return mixTheme(THEMES[i], THEMES[j], k);
}

/* =====================================================================
   PLACEHOLDER ARTWORK: abstract 16×16 pixel art from each album's 3 colors.
   In the app this is the real cover bitmap.
   ===================================================================== */
function paintArt(canvasEl, album, seed) {
  canvasEl.width = 16; canvasEl.height = 16;
  const c = canvasEl.getContext('2d');
  const cols = album.art;
  for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) {
    const v = Math.sin(x * 0.45 + seed) + Math.cos(y * 0.38 + seed * 1.7) + Math.sin((x + y) * 0.2 + seed * 0.5);
    const i = Math.min(2, Math.max(0, Math.floor((v + 3) / 6 * 3.2)));
    c.fillStyle = cols[i]; c.fillRect(x, y, 1, 1);
  }
}

/* =====================================================================
   PALETTE FROM ARTWORK
   1. Downsample the cover and cluster its pixels into 4 colors (k-means).
   2. Sort them dark → light and spread them into the same 10-step ping-pong
      ramp the home themes use.
   3. Pick text/button colors for contrast: title is near-white or near-black,
      whichever reads better on every background color.
   (On Android use androidx.palette instead of k-means: see the brief.)
   ===================================================================== */
function paletteFromArt(canvasEl) {
  const s = 24, off = document.createElement('canvas');
  off.width = s; off.height = s;
  const c = off.getContext('2d');
  c.imageSmoothingEnabled = false;
  c.drawImage(canvasEl, 0, 0, s, s);
  const data = c.getImageData(0, 0, s, s).data, px = [];
  for (let i = 0; i < data.length; i += 4) px.push([data[i], data[i+1], data[i+2]]);

  // k-means, k = 4, seeded from luminance quartiles
  const sorted = px.slice().sort((a, b) => lum(a) - lum(b));
  let cents = [0.1, 0.4, 0.65, 0.9].map((q) => sorted[Math.floor(q * (sorted.length - 1))].slice());
  for (let it = 0; it < 8; it++) {
    const sums = cents.map(() => [0, 0, 0, 0]);
    for (const p of px) {
      let best = 0, bd = Infinity;
      cents.forEach((ct, k) => { const d = (p[0]-ct[0])**2 + (p[1]-ct[1])**2 + (p[2]-ct[2])**2; if (d < bd) { bd = d; best = k; } });
      const sm = sums[best]; sm[0] += p[0]; sm[1] += p[1]; sm[2] += p[2]; sm[3]++;
    }
    cents = cents.map((ct, k) => sums[k][3] ? [sums[k][0]/sums[k][3], sums[k][1]/sums[k][3], sums[k][2]/sums[k][3]] : ct);
  }
  cents.sort((a, b) => lum(a) - lum(b));

  // 6 stops dark → light through the 4 cluster colors, then mirror → 10 (same shape as the home themes)
  const stops = [];
  for (let i = 0; i < 6; i++) { const t = i / 5 * 3, k = Math.min(2, Math.floor(t)); stops.push(lerp(cents[k], cents[k + 1], t - k)); }
  const pal = [0,1,2,3,4,5,4,3,2,1].map((i) => stops[i]);

  // Text: near-white or near-black, whichever has the better worst-case contrast on the ramp
  const WHITE = [255, 255, 255], BLACK = [17, 17, 17];
  const minC = (t) => Math.min(...pal.map((c) => contrast(t, c)));
  const title = minC(WHITE) >= minC(BLACK) ? WHITE : BLACK;
  const darkText = title === BLACK;
  // Primary button: filled with the title color; its label uses the most saturated album color that still contrasts with it
  const byPunch = cents.slice().sort((a, b) => sat(b) - sat(a));
  const pFg = byPunch.find((c) => contrast(c, title) >= 4.5) || (darkText ? WHITE : BLACK);
  // Secondary button: the album's lightest (dark text) or darkest (light text) color, outlined in the title color
  const sBg = darkText ? cents[3] : cents[0];
  return { pal, title, pBg: title, pFg, sBg, sFg: title, sBd: title };
}

/* ---------- Elements ---------- */
const $ = (id) => document.getElementById(id);
const canvas = $('bg'), ctx = canvas.getContext('2d');
const titleEl = $('title'), titleText = $('titleText'), cursor = $('cursor'), live = $('live');
const labelEl = $('label'), ctasEl = $('ctas'), albumsEl = $('albums'), coverEl = $('cover');
const primary = $('primary'), secondary = $('secondary');
const primaryLabel = $('primaryLabel'), secondaryLabel = $('secondaryLabel');
const icons = { shuffle: $('iconShuffle'), play: $('iconPlay'), stack: $('iconStack'), shuffle2: $('iconShuffle2') };

/* ---------- Album strip ---------- */
const marquee = $('marquee');
ALBUMS.concat(ALBUMS).forEach((a, i) => { const cv = document.createElement('canvas'); paintArt(cv, a, (i % ALBUMS.length) * 1.37); marquee.appendChild(cv); });

/* =====================================================================
   BACKGROUND THEME: home cycle, or the selected album's colors.
   `overlay` blends from whatever was showing to the target (album theme,
   or back to the live cycle when `to` is null) over ALBUM_BLEND seconds.
   ===================================================================== */
let overlay = null, shown = null;
function currentTheme(now) {
  const base = cycleTheme(now);
  if (!overlay) return base;
  const p = Math.min(1, (now - overlay.t0) / 1000 / ALBUM_BLEND);
  const k = p * p * (3 - 2 * p);
  const out = mixTheme(overlay.from, overlay.to || base, k);
  if (p >= 1 && !overlay.to) overlay = null;
  return out;
}
function blendTo(target) { overlay = { from: shown, to: target, t0: performance.now() }; }

/* ---------- Background: pixel field + tap waves ---------- */
let waves = [];
function addWave(fromEl) {
  const cr = canvas.getBoundingClientRect(), br = fromEl.getBoundingClientRect();
  waves.push({ fx: (br.left + br.width / 2 - cr.left) / cr.width, fy: (br.top + br.height / 2 - cr.top) / cr.height, t0: performance.now() });
  if (waves.length > 4) waves.shift();
}
function draw(now) {
  const th = currentTheme(now);
  shown = th;
  titleEl.style.color = css(th.title); labelEl.style.color = css(th.title);
  primary.style.backgroundColor = css(th.pBg); primary.style.color = css(th.pFg);
  secondary.style.backgroundColor = css(th.sBg); secondary.style.color = css(th.sFg); secondary.style.borderColor = css(th.sBd);

  const w = Math.ceil(390 / PIXEL), h = Math.ceil(844 / PIXEL);
  if (canvas.width !== w) canvas.width = w;
  if (canvas.height !== h) canvas.height = h;
  const s = (now / 1000) * (SPEED / 120);
  const cx = w * (0.5 + 0.45 * Math.sin(s * 0.7)), cy = h * (0.5 + 0.4 * Math.cos(s * 0.53));
  const PAL = th.pal.map(css), P = PAL.length, reach = Math.hypot(w, h);
  const active = waves.map((wv) => { const age = (now - wv.t0) / 1000; return { x: wv.fx * w, y: wv.fy * h, r: age * reach / 1.1, fade: 1 - age / 1.3 }; }).filter((wv) => wv.fade > 0);
  waves = waves.filter((wv) => (now - wv.t0) / 1000 < 1.3);
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const v = Math.sin(x*0.18 + s*1.3) + Math.sin(y*0.11 - s*0.9) + Math.sin(x*0.12 + y*0.08 + s*1.1) + Math.sin(Math.hypot(x-cx, y-cy)*0.28 - s*1.7);
      let push = 0;
      for (const a of active) { const d = Math.hypot(x - a.x, y - a.y) - a.r; push += Math.exp(-(d*d)/6) * a.fade * 5; }
      ctx.fillStyle = PAL[((Math.floor(((v + 4) / 8) * P * 2 + s * 0.8 + push) % P) + P) % P];
      ctx.fillRect(x, y, 1, 1);
    }
  }
}

/* ---------- Typewriter ---------- */
let token = 0;
function typewrite(el, to, myToken, { onCleared, onDone } = {}) {
  let current = el.textContent;
  const erase = () => {
    if (myToken !== token) return;
    if (current.length) { current = current.slice(0, -1); el.textContent = current; setTimeout(erase, ERASE_MS); }
    else { if (onCleared) onCleared(); type(1); }
  };
  const type = (n) => {
    if (myToken !== token) return;
    el.textContent = to.slice(0, n);
    if (n < to.length) setTimeout(() => type(n + 1), TYPE_MS);
    else if (onDone) onDone();
  };
  erase();
}
function fitTitle(text) {
  const m = document.createElement('div');
  m.style.cssText = 'position:absolute;visibility:hidden;left:-9999px;top:0;width:' + TITLE_W + 'px;font-family:"Jersey 10",system-ui,sans-serif;line-height:0.75;white-space:pre-line;overflow-wrap:normal';
  m.textContent = text;
  document.body.appendChild(m);
  let size = TITLE_MAX;
  for (; size > TITLE_MIN; size -= 4) {
    m.style.fontSize = size + 'px';
    if (m.scrollWidth <= TITLE_W && m.scrollHeight <= TITLE_H) break;
  }
  m.style.fontSize = size + 'px';
  const h = m.scrollHeight;
  m.remove();
  return { size, h };
}
function retitle(text, myToken, onDone, forcedSize) {
  const fit = forcedSize ? { size: forcedSize, h: TITLE_H } : fitTitle(text);
  cursor.hidden = false;
  typewrite(titleText, text, myToken, {
    onCleared: () => { titleEl.style.fontSize = fit.size + 'px'; },
    onDone: () => { cursor.hidden = true; if (onDone) onDone(); }
  });
  return fit;
}
const show = (el, on) => { el.style.display = on ? '' : 'none'; };
function relabel(mode, myToken) {
  const L = LABELS[mode], sel = mode === 'selected';
  typewrite(primaryLabel, L.primary, myToken, { onCleared: () => { show(icons.shuffle, !sel); show(icons.play, sel); } });
  typewrite(secondaryLabel, L.secondary, myToken, { onCleared: () => { show(icons.stack, !sel); show(icons.shuffle2, sel); } });
}

/* ---------- States ---------- */
let mode = 'home', currentIdx = -1;

function pickAlbum(fromEl) {
  const myToken = ++token;
  addWave(fromEl);

  let idx;
  do { idx = Math.floor(Math.random() * ALBUMS.length); } while (ALBUMS.length > 1 && idx === currentIdx);
  currentIdx = idx;
  const album = ALBUMS[idx];

  // Paint the cover (hidden), read its colors, and blend the background into them.
  const firstPick = mode !== 'selected';
  const reveal = () => {
    paintArt(coverEl, album, idx * 1.37);
    blendTo(paletteFromArt(coverEl));
  };

  if (firstPick) {
    mode = 'selected';
    ctasEl.classList.add('down'); albumsEl.classList.add('out');
    relabel('selected', myToken);
    reveal();
  } else {
    coverEl.classList.remove('show');
  }
  const fit = retitle(album.name, myToken, () => { live.textContent = album.name; });

  // Cover sits 24 under the title text and fills the space down to the buttons (max 341, min 80).
  setTimeout(() => {
    if (myToken !== token) return;
    if (!firstPick) reveal();
    const top = TITLE_TOP + fit.h + COVER_GAP;
    const side = Math.max(80, Math.min(COVER_MAX, CTAS_TOP - COVER_GAP - top));
    Object.assign(coverEl.style, { top: top + 'px', width: side + 'px', height: side + 'px', left: ((FRAME_W - side) / 2) + 'px' });
    coverEl.classList.add('show');
  }, firstPick ? 350 : 250);
}

// Android back gesture while an album is selected (Esc in this preview).
function goHome() {
  if (mode !== 'selected') return;
  const myToken = ++token;
  mode = 'home';
  currentIdx = -1;
  coverEl.classList.remove('show');
  ctasEl.classList.remove('down'); albumsEl.classList.remove('out');
  blendTo(null);
  relabel('home', myToken);
  retitle(HOME_TITLE, myToken, () => { live.textContent = 'Inicio'; }, TITLE_MAX);
  primary.focus();
}

/* ---------- Buttons ---------- */
primary.addEventListener('click', () => {
  if (mode === 'home') pickAlbum(primary);
  else { /* TODO: "Escuchar" — play the selected album */ addWave(primary); }
});
secondary.addEventListener('click', () => {
  if (mode === 'selected') pickAlbum(secondary);
  else { /* TODO: "Colecciones" — open collections */ }
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') goHome(); });

/* ---------- Loop ---------- */
const still = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function loop(now) { draw(now); if (!still) requestAnimationFrame(loop); }
requestAnimationFrame(loop);
</script>
</body>
</html>
